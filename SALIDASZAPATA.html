<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8b1118" />
  <title>Salidas Almacén Zapata | PROVSOFT</title>
  <style>
    :root{
      --vino:#8b1118;
      --vino2:#b91c1c;
      --fondo:#f4f6f8;
      --texto:#18212b;
      --gris:#667085;
      --linea:#e4e7ec;
      --blanco:#fff;
      --verde:#087a55;
      --sombra:0 12px 35px rgba(16,24,40,.10);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--texto)}
    header{background:linear-gradient(135deg,#65090e,var(--vino2));color:#fff;padding:22px 18px;box-shadow:0 5px 18px rgba(80,0,0,.25)}
    .encabezado{max-width:1400px;margin:auto;display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}
    h1{margin:0;font-size:clamp(24px,4vw,38px)}
    .subtitulo{margin-top:6px;opacity:.9}
    .estado{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:10px 14px;border-radius:999px;font-weight:700}
    main{max-width:1400px;margin:22px auto;padding:0 16px 40px}
    .panel{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sombra);margin-bottom:18px}
    .filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px}
    input,select,button{font:inherit}
    input,select{width:100%;padding:12px 13px;border:1px solid var(--linea);border-radius:11px;background:#fff;outline:none}
    input:focus,select:focus{border-color:var(--vino2);box-shadow:0 0 0 3px rgba(185,28,28,.12)}
    button{border:0;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer}
    .btn{background:var(--vino);color:#fff}
    .btn-sec{background:#eef1f4;color:#344054}
    .resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
    .dato{border:1px solid var(--linea);border-radius:13px;padding:14px;background:#fafafa}
    .dato b{display:block;font-size:24px;margin-top:4px;color:var(--vino)}
    .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
    .tarjeta{background:#fff;border:1px solid var(--linea);border-radius:18px;overflow:hidden;box-shadow:0 7px 22px rgba(16,24,40,.07);display:flex;flex-direction:column}
    .tarjeta-head{padding:15px 16px;background:linear-gradient(135deg,#fff7f7,#fff);border-bottom:1px solid var(--linea)}
    .folio{font-size:20px;font-weight:800;color:var(--vino)}
    .meta{display:flex;justify-content:space-between;gap:10px;color:var(--gris);font-size:13px;margin-top:6px}
    .tarjeta-body{padding:15px 16px;display:grid;gap:9px;flex:1}
    .fila{display:grid;grid-template-columns:95px 1fr;gap:10px;font-size:14px}
    .fila strong{color:#475467}
    .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
    .chip{background:#f2f4f7;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
    .firma-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:7px}
    .firma-mini div{border:1px dashed #cfd4dc;border-radius:10px;padding:7px;text-align:center;background:#fafafa;min-height:92px}
    .firma-mini img{max-width:100%;height:62px;object-fit:contain;background:#fff}
    .firma-mini span{display:block;font-size:11px;color:var(--gris);margin-top:4px}
    .tarjeta-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--linea)}
    .tarjeta-foot button{flex:1}
    .vacio,.cargando,.error{grid-column:1/-1;background:#fff;border-radius:16px;padding:36px;text-align:center;box-shadow:var(--sombra)}
    .error{color:#b42318}
    .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.68);z-index:1000;padding:18px;overflow:auto}
    .modal.abierto{display:block}
    .hoja{max-width:980px;margin:20px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.3)}
    .hoja-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;background:var(--vino);color:#fff}
    .acciones{display:flex;gap:8px;flex-wrap:wrap}
    .acciones button{background:#fff;color:var(--vino)}
    .detalle{padding:22px}
    .datos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin-bottom:20px}
    .dato-linea{padding:10px 0;border-bottom:1px solid var(--linea)}
    .dato-linea small{display:block;color:var(--gris);margin-bottom:4px}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:11px 9px;border-bottom:1px solid var(--linea);text-align:left;font-size:14px}
    th{background:#f8fafc;color:#475467}
    .cantidad{text-align:right;font-weight:800}
    .firmas-detalle{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
    .firma-box{border:1px solid var(--linea);border-radius:14px;padding:12px;text-align:center;min-height:190px}
    .firma-box img{width:100%;height:130px;object-fit:contain;background:#fff}
    .firma-box b{display:block;margin-top:8px}
    @media(max-width:900px){.filtros{grid-template-columns:1fr 1fr}.resumen{grid-template-columns:1fr 1fr}}
    @media(max-width:620px){.filtros{grid-template-columns:1fr}.resumen{grid-template-columns:1fr 1fr}.rejilla{grid-template-columns:1fr}.datos-grid,.firmas-detalle{grid-template-columns:1fr}.meta{flex-direction:column}.fila{grid-template-columns:82px 1fr}}
    @media print{
      body{background:#fff}
      header,main,.hoja-top .acciones{display:none!important}
      .modal{position:static;display:block!important;background:#fff;padding:0}
      .hoja{box-shadow:none;margin:0;max-width:none;border-radius:0}
      .hoja-top{background:#fff;color:#000;border-bottom:2px solid #000}
      .detalle{padding:10mm}
    }
  </style>
</head>
<body>
<header>
  <div class="encabezado">
    <div>
      <h1>Salidas de Almacén Zapata</h1>
      <div class="subtitulo">Consulta en tiempo real, firmas, artículos e información completa</div>
    </div>
    <div class="estado" id="estadoConexion">Conectando…</div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="filtros">
      <input id="busqueda" placeholder="Buscar folio, persona, destino, código o producto…" />
      <input id="fechaDesde" type="date" title="Desde" />
      <input id="fechaHasta" type="date" title="Hasta" />
      <select id="destinoFiltro"><option value="">Todos los destinos</option></select>
      <button class="btn-sec" id="limpiar">Limpiar</button>
    </div>
    <div class="resumen">
      <div class="dato">Salidas visibles<b id="totalSalidas">0</b></div>
      <div class="dato">Artículos distintos<b id="totalPartidas">0</b></div>
      <div class="dato">Unidades totales<b id="totalUnidades">0</b></div>
      <div class="dato">Con ambas firmas<b id="totalFirmadas">0</b></div>
    </div>
  </section>

  <section class="rejilla" id="contenedor">
    <div class="cargando">Cargando salidas…</div>
  </section>
</main>

<div class="modal" id="modal">
  <article class="hoja" id="hojaImpresion">
    <div class="hoja-top">
      <div>
        <strong style="font-size:22px">Comprobante de salida</strong>
        <div id="modalFolio" style="margin-top:4px"></div>
      </div>
      <div class="acciones">
        <button onclick="window.print()">Imprimir</button>
        <button id="cerrarModal">Cerrar</button>
      </div>
    </div>
    <div class="detalle" id="detalle"></div>
  </article>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCK5nb6u2CGRJ8AB1aPlRn54b97bdeAFeM",
    authDomain: "inventariopv-643f1.firebaseapp.com",
    projectId: "inventariopv-643f1",
    storageBucket: "inventariopv-643f1.firebasestorage.app",
    messagingSenderId: "96242533231",
    appId: "1:96242533231:web:aae75a18fbaf9840529e9a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const ruta = collection(db, "almacenes", "almacen_zapata", "salidas1.0");

  const $ = id => document.getElementById(id);
  const contenedor = $("contenedor");
  let salidas = [];
  let salidasFiltradas = [];

  function texto(v, defecto = "Sin dato") {
    return v === null || v === undefined || String(v).trim() === "" ? defecto : String(v);
  }

  function escapeHTML(v) {
    return String(v ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function obtenerProductos(s) {
    const lista = Array.isArray(s.articulos) ? s.articulos : (Array.isArray(s.productos) ? s.productos : []);
    return lista.map(x => ({
      codigo: texto(x.codigo ?? x.codigoBarra, "S/C"),
      nombre: texto(x.nombre ?? x.descripcion ?? x.concepto, "Sin descripción"),
      cantidad: Number(String(x.cantidad ?? 0).replace(/[^0-9.-]/g, "")) || 0
    }));
  }

  function fechaNormalizada(s) {
    if (s.creadoEn?.toDate) return s.creadoEn.toDate();
    if (s.timestamp?.toDate) return s.timestamp.toDate();
    if (s.createdAt) {
      const d = new Date(s.createdAt);
      if (!isNaN(d)) return d;
    }
    if (s.fecha) {
      const d = new Date(String(s.fecha).length === 10 ? s.fecha + "T12:00:00" : s.fecha);
      if (!isNaN(d)) return d;
    }
    return new Date(0);
  }

  function fechaMostrar(s) {
    const d = fechaNormalizada(s);
    if (d.getTime() === 0) return texto(s.fecha, "Sin fecha");
    return d.toLocaleString("es-MX", { dateStyle:"medium", timeStyle:"short" });
  }

  function folioNumero(folio) {
    const n = String(folio ?? "").match(/\d+/g);
    return n ? Number(n.join("")) : 0;
  }

  function firmaHTML(src, etiqueta) {
    if (!src || !String(src).startsWith("data:image")) {
      return `<div><div style="height:62px;display:grid;place-items:center;color:#98a2b3">Sin firma</div><span>${etiqueta}</span></div>`;
    }
    return `<div><img src="${src}" alt="${etiqueta}"><span>${etiqueta}</span></div>`;
  }

  function cargarDestinos() {
    const actual = $("destinoFiltro").value;
    const destinos = [...new Set(salidas.map(s => texto(s.destino, "")).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    $("destinoFiltro").innerHTML = `<option value="">Todos los destinos</option>` + destinos.map(d => `<option value="${escapeHTML(d)}">${escapeHTML(d)}</option>`).join("");
    $("destinoFiltro").value = actual;
  }

  function aplicarFiltros() {
    const q = $("busqueda").value.trim().toLowerCase();
    const desde = $("fechaDesde").value ? new Date($("fechaDesde").value + "T00:00:00") : null;
    const hasta = $("fechaHasta").value ? new Date($("fechaHasta").value + "T23:59:59") : null;
    const destino = $("destinoFiltro").value;

    salidasFiltradas = salidas.filter(s => {
      const productos = obtenerProductos(s);
      const bolsa = [s.folio,s.fecha,s.entrega,s.recibe,s.destino,s.folioCincho,s.estado,
        ...productos.flatMap(p => [p.codigo,p.nombre,p.cantidad])].join(" ").toLowerCase();
      const f = fechaNormalizada(s);
      return (!q || bolsa.includes(q)) && (!desde || f >= desde) && (!hasta || f <= hasta) && (!destino || s.destino === destino);
    });

    renderizar();
  }

  function actualizarResumen() {
    let partidas = 0, unidades = 0, firmadas = 0;
    salidasFiltradas.forEach(s => {
      const p = obtenerProductos(s);
      partidas += p.length;
      unidades += p.reduce((a,x)=>a+x.cantidad,0);
      if (s.firmaEntrega && s.firmaRecibe) firmadas++;
    });
    $("totalSalidas").textContent = salidasFiltradas.length.toLocaleString("es-MX");
    $("totalPartidas").textContent = partidas.toLocaleString("es-MX");
    $("totalUnidades").textContent = unidades.toLocaleString("es-MX");
    $("totalFirmadas").textContent = firmadas.toLocaleString("es-MX");
  }

  function renderizar() {
    actualizarResumen();
    if (!salidasFiltradas.length) {
      contenedor.innerHTML = `<div class="vacio">No se encontraron salidas con esos filtros.</div>`;
      return;
    }

    contenedor.innerHTML = salidasFiltradas.map((s, i) => {
      const productos = obtenerProductos(s);
      const unidades = productos.reduce((a,x)=>a+x.cantidad,0);
      return `<article class="tarjeta">
        <div class="tarjeta-head">
          <div class="folio">${escapeHTML(texto(s.folio,"Sin folio"))}</div>
          <div class="meta"><span>${escapeHTML(fechaMostrar(s))}</span><span>${escapeHTML(texto(s.estado,"GUARDADA"))}</span></div>
        </div>
        <div class="tarjeta-body">
          <div class="fila"><strong>Entrega:</strong><span>${escapeHTML(texto(s.entrega))}</span></div>
          <div class="fila"><strong>Recibe:</strong><span>${escapeHTML(texto(s.recibe))}</span></div>
          <div class="fila"><strong>Destino:</strong><span>${escapeHTML(texto(s.destino))}</span></div>
          <div class="fila"><strong>Cincho:</strong><span>${escapeHTML(texto(s.folioCincho,"Sin asignar"))}</span></div>
          <div class="chips"><span class="chip">${productos.length} partidas</span><span class="chip">${unidades} unidades</span></div>
          <div class="firma-mini">${firmaHTML(s.firmaEntrega,"Firma entrega")}${firmaHTML(s.firmaRecibe,"Firma recibe")}</div>
        </div>
        <div class="tarjeta-foot">
          <button class="btn" data-ver="${i}">Ver comprobante</button>
        </div>
      </article>`;
    }).join("");

    document.querySelectorAll("[data-ver]").forEach(btn => btn.addEventListener("click", () => abrirDetalle(salidasFiltradas[Number(btn.dataset.ver)])));
  }

  function abrirDetalle(s) {
    const productos = obtenerProductos(s);
    const unidades = productos.reduce((a,x)=>a+x.cantidad,0);
    $("modalFolio").textContent = texto(s.folio,"Sin folio");
    $("detalle").innerHTML = `
      <div class="datos-grid">
        <div class="dato-linea"><small>Fecha y hora</small><b>${escapeHTML(fechaMostrar(s))}</b></div>
        <div class="dato-linea"><small>Estado</small><b>${escapeHTML(texto(s.estado,"GUARDADA"))}</b></div>
        <div class="dato-linea"><small>Entregó</small><b>${escapeHTML(texto(s.entrega))}</b></div>
        <div class="dato-linea"><small>Recibió</small><b>${escapeHTML(texto(s.recibe))}</b></div>
        <div class="dato-linea"><small>Destino</small><b>${escapeHTML(texto(s.destino))}</b></div>
        <div class="dato-linea"><small>Folio de cincho</small><b>${escapeHTML(texto(s.folioCincho,"Sin asignar"))}</b></div>
        <div class="dato-linea"><small>Capturado por</small><b>${escapeHTML(texto(s.capturadoPorEmail || s.capturadoPorUid,"No registrado"))}</b></div>
        <div class="dato-linea"><small>Dispositivo</small><b style="font-size:12px">${escapeHTML(texto(s.dispositivo,"No registrado"))}</b></div>
      </div>
      <h3>Artículos de la salida</h3>
      <table>
        <thead><tr><th>#</th><th>Código</th><th>Artículo</th><th class="cantidad">Cantidad</th></tr></thead>
        <tbody>${productos.map((p,i)=>`<tr><td>${i+1}</td><td>${escapeHTML(p.codigo)}</td><td>${escapeHTML(p.nombre)}</td><td class="cantidad">${p.cantidad}</td></tr>`).join("") || `<tr><td colspan="4">Sin artículos registrados</td></tr>`}</tbody>
        <tfoot><tr><th colspan="3">Total de unidades</th><th class="cantidad">${unidades}</th></tr></tfoot>
      </table>
      <div class="firmas-detalle">
        <div class="firma-box">${s.firmaEntrega ? `<img src="${s.firmaEntrega}" alt="Firma entrega">` : `<div style="height:130px;display:grid;place-items:center;color:#98a2b3">Sin firma</div>`}<b>${escapeHTML(texto(s.entrega,"Entrega"))}</b><small>Firma de quien entrega</small></div>
        <div class="firma-box">${s.firmaRecibe ? `<img src="${s.firmaRecibe}" alt="Firma recibe">` : `<div style="height:130px;display:grid;place-items:center;color:#98a2b3">Sin firma</div>`}<b>${escapeHTML(texto(s.recibe,"Recibe"))}</b><small>Firma de quien recibe</small></div>
      </div>`;
    $("modal").classList.add("abierto");
  }

  $("cerrarModal").addEventListener("click", () => $("modal").classList.remove("abierto"));
  $("modal").addEventListener("click", e => { if (e.target === $("modal")) $("modal").classList.remove("abierto"); });
  ["busqueda","fechaDesde","fechaHasta","destinoFiltro"].forEach(id => $(id).addEventListener(id === "busqueda" ? "input" : "change", aplicarFiltros));
  $("limpiar").addEventListener("click", () => {
    $("busqueda").value = ""; $("fechaDesde").value = ""; $("fechaHasta").value = ""; $("destinoFiltro").value = ""; aplicarFiltros();
  });

  onSnapshot(ruta, snap => {
    salidas = snap.docs.map(doc => ({ id:doc.id, ...doc.data() }))
      .sort((a,b) => fechaNormalizada(b)-fechaNormalizada(a) || folioNumero(b.folio)-folioNumero(a.folio));
    $("estadoConexion").textContent = `En línea · ${salidas.length} registros`;
    cargarDestinos();
    aplicarFiltros();
  }, error => {
    console.error(error);
    $("estadoConexion").textContent = "Error de conexión";
    contenedor.innerHTML = `<div class="error"><b>No se pudieron leer las salidas.</b><br><br>${escapeHTML(error.message)}<br><br>Revisa las reglas de Firestore para la ruta:<br><code>almacenes/almacen_zapata/salidas1.0</code></div>`;
  });
</script>
</body>
</html>
